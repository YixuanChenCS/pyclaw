
[project]
name = "pyclaw"
description = "Pyclaw is AI pair programming in your terminal"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python",
    "Topic :: Software Development",
]
requires-python = ">=3.10,<3.15"
dynamic = ["dependencies", "optional-dependencies", "version"]

[project.urls]
Homepage = "https://github.com/Pyclaw-AI/pyclaw"

[project.scripts]
pyclaw = "pyclaw.main:main"

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }

[tool.setuptools.dynamic.optional-dependencies]
# The compiled *.txt files are interpreter-specific lock outputs.
# Use the source *.in files for extras so markers remain valid across
# every Python version declared in requires-python.
dev = { file = "requirements/requirements-dev.in" }
help = { file = "requirements/requirements-help.in" }
browser = { file = "requirements/requirements-browser.in" }
playwright = { file = "requirements/requirements-playwright.in" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pyclaw*", "apps*", "services*", "packages*"]

[build-system]
requires = ["setuptools>=68", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "pyclaw/_version.py"

[tool.codespell]
skip = "*.svg,Gemfile.lock,tests/fixtures/*,pyclaw/website/assets/*"
write-changes = true
