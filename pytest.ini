[pytest]
norecursedirs = tmp.* build benchmark _site OLD
addopts = -p no:warnings
testpaths =
    tests/unit
    tests/integration
    tests/optional
    tests/online

markers =
    unit: fast isolated tests for pure logic
    integration: tests that exercise multiple local components together
    optional: tests for optional dependencies or features
    online: tests that probe live external URLs or services

env =
    PYCLAW_ANALYTICS=false
